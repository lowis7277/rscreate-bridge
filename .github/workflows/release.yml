name: Release

# Pushing a version tag (v1.0.0, v1.1.0…) builds the mod, runs the GameTests and publishes a GitHub release with
# the jar. The release notes are that version's section of CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: GameTests
        run: ./gradlew runGameTestServer

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - uses: softprops/action-gh-release@v2
        with:
          name: RS Create Bridge ${{ github.ref_name }}
          body_path: notes.md
          files: build/libs/rscreatebridge-1.21.1-*.jar
