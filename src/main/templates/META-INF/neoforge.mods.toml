modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/lowis7277/rscreate-bridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Lowis7277"
displayURL="https://github.com/lowis7277/rscreate-bridge"
logoFile="logo.png"
description='''
Lets the Refined Storage 2 Autocrafter run Create machines: Mechanical Crafters, sequenced assembly, press, deployer and spout recipes on a depot, and mixer and press recipes on a basin.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="required"
    versionRange="[${rs2_version},2.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[${create_version},6.1)"
    ordering="AFTER"
    side="BOTH"
