plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // Flywheel and Ponder (used by Create)
    maven { url = 'https://maven.createmod.net' }
    // Registrate (used by Create)
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    // Release jars of Create, Refined Storage and JEI, exactly as published on Modrinth
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    compileOnly "maven.modrinth:create:${create_version}+mc${minecraft_version}"
    compileOnly "maven.modrinth:refined-storage:${rs2_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    // JEI is optional: only used for the Pattern Grid "+" button on sequenced assembly recipes.
    compileOnly "maven.modrinth:jei:${jei_version}"

    localRuntime "maven.modrinth:create:${create_version}+mc${minecraft_version}"
    localRuntime "maven.modrinth:refined-storage:${rs2_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            rs2_version            : rs2_version,
            create_version         : create_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

// Optional local configuration (not part of the repository).
if (file('local.gradle').exists()) {
    apply from: 'local.gradle'
}
